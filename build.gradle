// Shared build configuration for the J's Tech Series: every subproject is one mod (or the core library),
// built with the same toolchain, the same NeoForge version and the same version number.
plugins {
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Each mod's changelog, written from the series' one.
apply from: 'gradle/changelogs.gradle'

// The version every artifact carries (the jar names and the mod metadata alike). A build from a tree that is
// not the tagged release commit is a snapshot named after the commit it came from, "0.2.0a-SNAPSHOT.6a288a7":
// the loader orders a snapshot below its release and above the previous one, so a development jar never
// shadows a release. Build the tagged release with -Prelease to drop the suffix.
def gitShortSha = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() }.getOrElse('')
version = providers.gradleProperty('release').isPresent()
        ? mod_version
        : "${mod_version}-SNAPSHOT.${gitShortSha.isEmpty() ? 'local' : gitShortSha}"
group = mod_group_id

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'idea'

    version = rootProject.version
    group = rootProject.group

    // Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    repositories {
        // Maven Central: test dependencies (JUnit) and any non-Minecraft library that lives there.
        mavenCentral()
        // ModMaven mirror: dev-runtime mods used for integration testing.
        maven {
            name = 'ModMaven'
            url = 'https://modmaven.dev/'
            content {
                includeGroup 'mekanism'
                includeGroup 'appeng'
            }
        }
        // BlameJared: JEI, present in the dev client for recipe lookups while testing autocrafting, and CraftTweaker,
        // whose scripts reach the Core when it is installed.
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
            content {
                includeGroup 'mezz.jei'
                includeGroup 'com.blamejared.crafttweaker'
            }
        }
        // SquidDev: CC: Tweaked, whose API the Network Gateway compiles against; the whole mod joins the dev runs.
        maven {
            name = 'SquidDev'
            url = 'https://maven.squiddev.cc'
            content { includeGroup 'cc.tweaked' }
        }
        // Create + its libraries (Flywheel, Ponder): the Core's layer beside its contraptions compiles against it, and
        // the dev runs that ask for it carry it.
        maven {
            name = 'CreateMod'
            url = 'https://maven.createmod.net/'
        }
        // Registrate: Create's registration library.
        maven {
            name = 'Tterrag'
            url = 'https://maven.tterrag.com/'
        }
        maven {
            name = 'Devos'
            url = 'https://mvn.devos.one/snapshots'
            content { includeGroup 'com.tterrag.registrate' }
        }
        // Sable and its companion library: the moving sub-levels of Create Aeronautics, which the Core's layer meets.
        maven {
            name = 'RyanHCode'
            url = 'https://maven.ryanhcode.dev/releases'
            content {
                includeGroup 'dev.ryanhcode.sable'
                includeGroup 'dev.ryanhcode.sable-companion'
            }
        }
        // FTB Teams and the libraries it stands on: the Core's teams come from it when it is installed.
        maven {
            name = 'FTB'
            url = 'https://maven.ftb.dev/releases'
            content { includeGroup 'dev.ftb.mods' }
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev'
            content { includeGroup 'dev.architectury' }
        }
        // EMI: the second recipe viewer the Core's recipe pages are shown in.
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/releases'
            content { includeGroup 'dev.emi' }
        }
        // REI and Cloth Config: the third recipe viewer the Core's recipe pages are shown in, and what it needs.
        maven {
            name = 'Shedaniel'
            url = 'https://maven.shedaniel.me/'
            content { includeGroupByRegex 'me\\.shedaniel.*' }
        }
        // Curios and Accessories: the two equipment-slot mods the Core reads worn items from.
        maven {
            name = 'TheIllusiveC4'
            url = 'https://maven.theillusivec4.top'
            content { includeGroup 'top.theillusivec4.curios' }
        }
        maven {
            name = 'WispForest'
            url = 'https://maven.wispforest.io/releases'
            content { includeGroup 'io.wispforest' }
        }
        // KubeJS and Rhino: the scripting mod a modpack writes its recipes and loot in, with what the mods hand it.
        maven {
            name = 'LatvianDev'
            url = 'https://maven.latvian.dev/releases'
            content { includeGroup 'dev.latvian.mods' }
        }
        // Jade, through Modrinth's Maven: the block tooltip the Core's probe lines show in.
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content { includeGroup 'maven.modrinth' }
        }
        // Simple Voice Chat's API: the Core's voices go through the same walls, air and vacuum as its sounds.
        maven {
            name = 'MaxHenkel'
            url = 'https://maven.maxhenkel.de/repository/public'
            content { includeGroup 'de.maxhenkel.voicechat' }
        }
        // GeckoLib: shipped dependency of the computing mod, for the large block models with bones and animation.
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content { includeGroupByRegex 'software\\.bernie.*' }
        }
    }

    // Sets up a dependency configuration called 'localRuntime': a dependency present for runtime testing that
    // is "optional", meaning it will not be pulled by dependents of this mod.
    configurations {
        localRuntime
        runtimeClasspath.extendsFrom localRuntime
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    /*
     * The Core carries SnakeYAML inside its jar. Every development run loads the Core, and in one the game takes a
     * library that is not a mod only from this configuration, so each run gets it, at the version the Core carries.
     */
    def snakeYaml = dependencies.create('org.yaml:snakeyaml:2.7')
    configurations.matching { it.name == 'additionalRuntimeClasspath' }.configureEach {
        it.dependencies.add(snakeYaml)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Every error of a change that touches many files at once, not the first hundred.
        options.compilerArgs += ['-Xmaxerrs', '10000']
    }

    tasks.named('test', Test).configure {
        useJUnitPlatform()
    }

    // Every jar carries its licence: the LGPL's text and the GPL's, whose terms the LGPL builds on.
    tasks.named('jar', Jar).configure {
        from(rootProject.files('COPYING', 'COPYING.LESSER')) {
            into 'META-INF'
        }
    }

    // IDEA no longer downloads sources/javadoc jars for dependencies on its own.
    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }

    publishing {
        publications {
            // The Gradle plugin publishes itself, with the marker a build finds it by.
            if (project.name != 'gradle-plugin') {
                register('mavenJava', MavenPublication) {
                    from components.java
                }
            }
        }
        repositories {
            maven {
                url = "file://${rootProject.projectDir}/repo"
            }
            // Where the Gradle plugin's tests find the Core and its test kit, as a mod's build finds them locally.
            maven {
                name = 'pluginTests'
                url = rootProject.layout.buildDirectory.dir('plugin-test-repo')
            }
        }
    }
}
