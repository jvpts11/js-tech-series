// The test mod of the series: development only, never published. It holds the GameTests, the client tests and
// the test kit for every mod, so the shipped jars carry no test code and a test may span several mods. It also
// hosts the development runs, which load the core, the computing mod, the industrial mod and this one.
plugins {
    id 'net.neoforged.moddev'
}

// The runs below reach into the other subprojects' source sets, so those must be configured first.
evaluationDependsOn(':core')
evaluationDependsOn(':computers')
evaluationDependsOn(':industrial')

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// This jar is a by-product of the build, never a release: it is named for what it is and never published.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'development-only'
}
tasks.withType(PublishToMavenRepository).configureEach {
    enabled = false
}
tasks.withType(PublishToMavenLocal).configureEach {
    enabled = false
}

sourceSets.main.resources {
    // The structure templates the GameTests run inside are generated by this mod's own data run.
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

/*
 * -PwithoutComputerCraft runs the development mods without CC: Tweaked, to prove every mod stands without it. The
 * tests written against ComputerCraft's own classes could not even load then, so they leave that build, and the
 * GameTests are told which of the two worlds they run in.
 */
def withoutComputerCraft = providers.gradleProperty('withoutComputerCraft').isPresent()
/*
 * -PwithFtbTeams runs the development mods with FTB Teams, to prove the Core takes its teams from it; without it the
 * game's scoreboard teams answer, which is what every other run proves.
 */
def withFtbTeams = providers.gradleProperty('withFtbTeams').isPresent()
/*
 * -PwithEmi runs the development client with EMI beside JEI, to see the Core's bridge to EMI at work: the processing
 * machines' recipes and the areas screens keep clear. Off by default, so every other run shows JEI alone.
 */
def withEmi = providers.gradleProperty('withEmi').isPresent()
/*
 * -PwithRei runs the development client with REI (and Cloth Config, which it needs), to see the Core's bridge to REI
 * at work. Off by default, so every other run shows JEI alone.
 */
def withRei = providers.gradleProperty('withRei').isPresent()
// -PwithJade runs the development mods with Jade, to see the lines the Core's bridge gives its tooltip.
def withJade = providers.gradleProperty('withJade').isPresent()
/*
 * -PwithKubeJs runs the development mods with KubeJS and the test scripts in src/kubejs, copied into the run's kubejs
 * folder, to prove a modpack's scripts reach what the mods hand them; every other run proves the mods stand without it.
 */
def withKubeJs = providers.gradleProperty('withKubeJs').isPresent()
/*
 * -PwithCraftTweaker runs the development mods with CraftTweaker and the test scripts in src/crafttweaker, copied into
 * the run's scripts folder, to prove its scripts reach the Core's recipes, progress and events.
 */
def withCraftTweaker = providers.gradleProperty('withCraftTweaker').isPresent()
/*
 * -PwithFtbQuests runs the development mods with FTB Quests, and FTB Teams with it, to prove its quests have the
 * Core's kinds of task.
 */
def withFtbQuests = providers.gradleProperty('withFtbQuests').isPresent()
/*
 * -PwithCreate runs the development mods with Create, -PwithSable with Sable beside it, and -PwithAeronautics with
 * Create Aeronautics on both, to prove the Core's moving structures meet their contraptions and sub-levels as its layer
 * says; every other run proves the Core without them.
 */
def withAeronautics = providers.gradleProperty('withAeronautics').isPresent()
def withSable = withAeronautics || providers.gradleProperty('withSable').isPresent()
def withCreate = withSable || providers.gradleProperty('withCreate').isPresent()
if (withoutComputerCraft) {
    sourceSets.main.java {
        exclude '**/gametest/computers/ComputerCraftGameTests.java'
        exclude '**/gametest/computers/GatewayBridgeGameTests.java'
        exclude '**/gametest/computers/GatewaySigmaGameTests.java'
        exclude '**/gametest/computers/NetworkGatewayGameTests.java'
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = rootProject.file('run')
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Client tests: real client windows that create a test world, drive the screens with synthetic
        // input, take screenshots and write run/clienttests/shard-<i>/clienttests/report.txt. The suite is
        // split over `clientShards` windows (default 4) so shards can run side by side: by the ticks each test
        // took last time (run/clienttests/durations.txt, written by every run) so the shards end together, or
        // round-robin when nothing was measured yet.
        //   .\gradlew.bat runClientTests0   (one shard)   -PclientShards=6 to change the split; every shard at
        //   once: runClientTests0 ... runClientTests5 -PclientShards=6 --parallel
        def clientShards = (providers.gradleProperty('clientShards').getOrElse('4')) as int
        (0..<clientShards).each { shard ->
            create("clientTests${shard}") {
                client()
                gameDirectory = rootProject.file("run/clienttests/shard-${shard}")
                // 640 tall so the GUI (scale 2) shows the full 256-pixel monitor glass a player gets.
                programArguments.addAll '--width', '960', '--height', '640'
                systemProperty 'jsc.clienttests', 'true'
                systemProperty 'jsc.clienttests.shard', "${shard}"
                systemProperty 'jsc.clienttests.shards', "${clientShards}"
                // -PctOnly=<substring>[,<substring>...] runs only the client tests whose name contains any of
                // them (case-insensitive), so a few tests can be driven without stealing the mouse for the suite.
                systemProperty 'jsc.clienttests.only', (providers.gradleProperty('ctOnly').getOrElse(''))
                // -PctMods=<suite>[,<suite>...] runs only the client tests of those suites (core, computers,
                // industrial, series; see TestSuites), shared out over the shards as the whole suite is.
                systemProperty 'jsc.clienttests.mods', (providers.gradleProperty('ctMods').getOrElse(''))
                // -Pjfr records the window with Java Flight Recorder, for profiling what the client draws.
                if (providers.gradleProperty('jfr').present) {
                    jvmArguments.addAll(
                            '-XX:StartFlightRecording=settings=profile,name=jsc,dumponexit=true,filename='
                                    + rootProject.file("local/bench/jfr/client-shard-${shard}.jfr").absolutePath,
                            '-XX:FlightRecorderOptions=stackdepth=512')
                }
            }
        }

        server {
            server()
            gameDirectory = rootProject.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Launches GameTestServer, runs all registered gametests, then exits. By default the server crashes
        // when no gametests are provided.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = rootProject.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'jsc.gametests.computercraft', withoutComputerCraft ? 'absent' : 'present'
            // -PgtOnly=<TestClass or word>[,...] runs only those GameTests (see GameTestSelection).
            systemProperty 'jsc.gametests.only', (providers.gradleProperty('gtOnly').getOrElse(''))
            // -PgtMods=<suite>[,<suite>...] runs only the GameTests of those suites: core, computers, industrial,
            // series (see TestSuites). With -PgtOnly too, a test runs when it is in one of them and is named.
            systemProperty 'jsc.gametests.mods', (providers.gradleProperty('gtMods').getOrElse(''))
            systemProperty 'jsc.gametests.ftbteams', withFtbTeams || withFtbQuests ? 'present' : 'absent'
            systemProperty 'jsc.gametests.kubejs', withKubeJs ? 'present' : 'absent'
            systemProperty 'jsc.gametests.crafttweaker', withCraftTweaker ? 'present' : 'absent'
            systemProperty 'jsc.gametests.ftbquests', withFtbQuests ? 'present' : 'absent'
            systemProperty 'jsc.gametests.create', withCreate ? 'present' : 'absent'
            systemProperty 'jsc.gametests.sable', withSable ? 'present' : 'absent'
            // -Pjfr records the run with Java Flight Recorder, for profiling the scale benchmark. Deep stacks,
            // because what is being chased sits well below the tick. Off unless asked for.
            if (providers.gradleProperty('jfr').present) {
                jvmArguments.addAll(
                        '-XX:StartFlightRecording=settings=profile,name=jsc,dumponexit=true,filename='
                                + rootProject.file('local/bench/jfr/scale.jfr').absolutePath,
                        '-XX:FlightRecorderOptions=stackdepth=512')
            }
        }

        data {
            data()
            gameDirectory = rootProject.file('run')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // Applies to all the run configs above.
        configureEach {
            // "REGISTRIES": for firing of registry events (other markers: "SCAN", "REGISTRYDUMP").
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // Which source sets belong to which mod: the runs above load every one of them.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        jscore {
            sourceSet(rootProject.project(':core').sourceSets.main)
        }
        jsc {
            sourceSet(rootProject.project(':computers').sourceSets.main)
        }
        jsindustrial {
            sourceSet(rootProject.project(':industrial').sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':core')
    implementation project(':computers')
    implementation project(':industrial')

    // The computing mod's dependencies, present so the runs load them as well.
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Dev-runtime mods for the integration batteries: Mekanism (the Fusion Reactor battery), AE2 (a second
    // network beside ours) and JEI (recipe lookups while testing autocrafting).
    localRuntime "mekanism:Mekanism:${mekanism_version}"
    localRuntime "mekanism:Mekanism:${mekanism_version}:generators"
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    // The whole mod, not just its API, so a test rig can set a machine up the way a player would: install
    // its upgrades and switch its sorting on. Only this module compiles against it, and this module is
    // development-only and never released; the mods themselves keep Mekanism a soft, guarded dependency.
    compileOnly "mekanism:Mekanism:${mekanism_version}"
    localRuntime "appeng:appliedenergistics2:${ae2_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    // CC: Tweaked in the dev runs, so the Network Gateway bridge is tested against real ComputerCraft
    // computers, and its API for the test rigs that talk to them. Its NeoForge build carries the "forge" name.
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}"
    if (!withoutComputerCraft) {
        localRuntime "cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_tweaked_version}"
    }
    if (withFtbTeams || withFtbQuests) {
        localRuntime "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
        localRuntime "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
        localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    }
    // FTB Quests' own classes, for the test that its kinds of task hold the Core's, which runs only where it is.
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    if (withFtbQuests) {
        localRuntime("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }
    }
    if (withCraftTweaker) {
        localRuntime("com.blamejared.crafttweaker:CraftTweaker-neoforge-${minecraft_version}:${crafttweaker_version}") {
            transitive = false
        }
    }
    // EMI's API, for the client test that reads what the Core's bridge gave EMI when EMI is there.
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    if (withEmi) {
        localRuntime "dev.emi:emi-neoforge:${emi_version}"
    }
    // REI's API, for the client test that reads what the Core's bridge gave REI when REI is there.
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}") { transitive = false }
    if (withRei) {
        localRuntime("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}") { transitive = false }
        localRuntime("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}") { transitive = false }
        localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    }
    if (withJade) {
        localRuntime "maven.modrinth:jade:${jade_version}"
    }
    if (withKubeJs) {
        localRuntime("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
        localRuntime("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    }
    // Create's and Sable's own classes, for the tests of the Core's layer beside them, which run only where they are.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:"
            + "${sable_companion_version}") { transitive = false }
    if (withCreate) {
        localRuntime "com.simibubi.create:create-${minecraft_version}:${create_version}"
    }
    if (withSable) {
        localRuntime("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    }
    if (withAeronautics) {
        localRuntime("maven.modrinth:create-aeronautics:${aeronautics_version}") { transitive = false }
    }
}

// The test scripts go where KubeJS reads them, the kubejs folder of the run, before a run that has KubeJS.
var copyKubeJsScripts = tasks.register('copyKubeJsScripts', Copy) {
    from 'src/kubejs'
    into rootProject.file('run/kubejs')
}
// The CraftTweaker test scripts go where CraftTweaker reads them, the scripts folder of the run.
var copyCraftTweakerScripts = tasks.register('copyCraftTweakerScripts', Copy) {
    from 'src/crafttweaker/scripts'
    into rootProject.file('run/scripts')
}
tasks.matching { it.name in ['runGameTestServer', 'runServer', 'runClient'] }.configureEach {
    if (withKubeJs) {
        dependsOn copyKubeJsScripts
    }
    if (withCraftTweaker) {
        dependsOn copyCraftTweakerScripts
    }
}

// Expands the declared properties into the mod metadata template. A missing property is an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
