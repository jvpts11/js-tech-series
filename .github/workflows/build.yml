name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      suites:
        description: 'GameTest suites to run (core, computers, industrial, example, series); empty runs every suite'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile, unit tests and generated data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Work happens on feature branches, so they keep the cache warm too.
          cache-read-only: false

      - name: Build and run the unit tests
        run: ./gradlew build --console=plain

      - name: Regenerate the data of every mod
        # One at a time: the data runs share the same game directory.
        run: |
          for project in core computers industrial example tests; do
            ./gradlew ":$project:runData" --console=plain
          done

      - name: Check the generated data is committed
        run: |
          changes=$(git status --porcelain --untracked-files=all -- '*/src/generated/*' \
            ':(exclude)*/src/generated/resources/.cache/*')
          if [ -n "$changes" ]; then
            echo "The generated data is out of date. Run runData and commit what it writes:"
            echo "$changes"
            exit 1
          fi

      - name: Keep the unit test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: '*/build/reports/tests/'
          if-no-files-found: ignore

  suites:
    name: Choose the GameTest suites
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.choose.outputs.mods }}
      run: ${{ steps.choose.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Choose the suites
        id: choose
        # Each mod has its own suite of GameTests. A push runs the suites of the mods it touched; a change to the
        # build, to the shared test kit or to the workflows, a new branch, and a run by hand with no suites named run
        # every suite. A push that touches no code runs none.
        env:
          ASKED: ${{ inputs.suites }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! printf '%s' "$ASKED" | grep -Eq '^[a-z, ]*$'; then
              echo "Suites are named with lowercase letters and commas: core, computers, industrial, example, series."
              exit 1
            fi
            echo "mods=$ASKED" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "mods=" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mods=""
          every=false
          for file in $(git diff --name-only "$base" HEAD); do
            case "$file" in
              core/src/*|core/build.gradle) mods="$mods core example" ;;
              example/src/*|example/build.gradle) mods="$mods example" ;;
              computers/src/*|computers/build.gradle) mods="$mods computers series" ;;
              industrial/src/*|industrial/build.gradle) mods="$mods industrial series" ;;
              tests/src/main/java/dev/jstech/tests/gametest/*/*|tests/src/main/java/dev/jstech/tests/clienttest/*/*)
                mods="$mods $(echo "$file" | cut -d/ -f9)" ;;
              tests/*|build.gradle|settings.gradle|gradle.properties|gradle/*|.github/workflows/*) every=true ;;
            esac
          done
          if [ "$every" = true ]; then
            echo "mods=" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$mods" ]; then
            echo "mods=$(echo $mods | tr ' ' '\n' | sort -u | paste -sd, -)" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "mods=" >> "$GITHUB_OUTPUT"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  gametests:
    name: GameTests
    needs: suites
    if: needs.suites.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Run the GameTests
        # The server exits with the number of required tests that failed.
        run: ./gradlew :tests:runGameTestServer "-PgtMods=${{ needs.suites.outputs.mods }}" --console=plain

      - name: Keep the server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-logs
          path: run/logs/
          if-no-files-found: ignore

  gametests-without-computercraft:
    name: 'GameTests without CC: Tweaked'
    needs: suites
    if: needs.suites.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: 'Run the GameTests with CC: Tweaked out of the runtime'
        # CC: Tweaked is a soft dependency, so every mod must run unchanged without it.
        run: >
          ./gradlew :tests:runGameTestServer -PwithoutComputerCraft
          "-PgtMods=${{ needs.suites.outputs.mods }}" --console=plain

      - name: Keep the server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-logs-without-computercraft
          path: run/logs/
          if-no-files-found: ignore
