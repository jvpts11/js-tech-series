# J's Core Test Kit: what a mod built on J's Core tests itself with. Only ever a test dependency.
mod_id=jstestkit
mod_name=J's Core Test Kit
mod_description=The helpers a mod built on J's Core writes its GameTests and client tests with: a scene for every kit of the Core, arenas made in code, round trips through the save, time and chance under control, assertions that explain, the client test runner with its reference pictures, tests of cost, old saves and optional mods. A test dependency: it adds nothing to the game and is never installed.
