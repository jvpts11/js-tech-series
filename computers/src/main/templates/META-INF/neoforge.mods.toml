# Mod metadata for J's Computers.
# Values are filled in from gradle.properties at build time.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
# The work of others the mod draws on, shown on its page in the mods list; THIRD_PARTY_NOTICES.md has the notices.
credits = "Font of the manual's tables: Misc Fixed 6x10, from Markus Kuhn's ucs-fonts as the X.Org Foundation ships it, public domain, carried by J's Core. Logos in screenfetch: neofetch, MIT. Sounds: their makers on Freesound and Pixabay and the desktops' own sound themes, named in THIRD_PARTY_NOTICES.md."
# The mark the mods list shows at the head of this mod's page: its own logo over the series logo.
logoFile = "${mod_id}_logo.png"
logoBlur = true

# The square icon, for mod-list screens that show one.
[modproperties.${mod_id}]
catalogueImageIcon = "${mod_id}_icon.png"

# Mixin config. The mixins array stays empty until the first mixin is added
# under the dev.jstech.computers.mixin package.
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The series ships in lockstep: every mod requires the core at exactly its own version.
[[dependencies.${mod_id}]]
modId = "jscore"
type = "required"
versionRange = "[${mod_version}]"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[4.7,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanism"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "computercraft"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
