// J's Computers: the computing mod of the series. The development runs live in the tests subproject; this
// build only keeps the data generation run for its own resources.
plugins {
    id 'net.neoforged.moddev'
}

// The data run below reaches into the core's source set, so it must be configured first.
evaluationDependsOn(':core')

base {
    // jsc-1.21.1-0.2.0a.jar: the mod, the Minecraft line it is built for, its version.
    archivesName = "${mod_id}-${minecraft_version}"
}

// The notices of the third-party work this mod carries, beside its own licence.
tasks.named('jar', Jar).configure {
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
    }
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    // Exclude common development only resources from finalized outputs.
    exclude("**/*.bbmodel")          // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        data {
            data()
            gameDirectory = rootProject.file('run')
            // The mod id to generate for, where to write the result, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('core/src/main/resources/').getAbsolutePath()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    // Which source sets belong to which mod: the data run loads this mod and the core it depends on.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        jscore {
            sourceSet(rootProject.project(':core').sourceSets.main)
        }
    }
}

dependencies {
    // The core library of the series: the API this mod is written against.
    implementation project(':core')

    // ============================================================
    // Mod-loaded dependencies, included in the released JAR's requirements
    // ============================================================
    // GeckoLib: bone-based block models and animation. The Server Rack and Supercomputer Rack are one
    // model each, rendered by a GeckoLib block-entity renderer that shows the seated units per row.
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // ============================================================
    // Soft integrations, compiled against their APIs only; the runtime jars live with the dev runs (tests).
    // ============================================================
    // Mekanism API: the chemical bridge adapter compiles against it but the mod never loads a Mekanism class
    // unless Mekanism is present (soft dependency, guarded at runtime).
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    // JEI API: the plugin (IModPlugin, IRecipeTransferHandler, ...) compiles against it; never a hard dependency.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // CC: Tweaked API: the Network Gateway is a ComputerCraft peripheral, so the bridge compiles against the
    // API jar; nothing loads a ComputerCraft class unless the mod is present (soft dependency, guarded at
    // runtime). The 1.21.1 line publishes its NeoForge build under the "forge" artifact name.
    compileOnly "cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_tweaked_version}"
}

// Expands the declared properties into the mod metadata template. A missing property is an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// The generated metadata is part of the resources, for Gradle builds and the IDE alike.
sourceSets.main.resources.srcDir generateModMetadata
// Regenerate it on every project reload instead of by hand.
neoForge.ideSyncTask generateModMetadata

/*
 * Benchmarks of the Σ# runtime, run on demand and never part of the build: gradlew :computers:jmh. Options for
 * JMH go through -PjmhArgs (-PjmhArgs="-bm thrpt -tu ms" reports instructions per millisecond); the results land in
 * build/reports/jmh/results.json.
 */
sourceSets {
    jmh {
        java.srcDir 'src/jmh/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    jmhImplementation "org.openjdk.jmh:jmh-core:${jmh_version}"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmh_version}"
}

tasks.register('jmh', JavaExec) {
    description = 'Runs the JMH benchmarks of the Σ# runtime.'
    group = 'verification'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    // The forked JVM gets its classpath through a jar, since the full one is too long for a Windows command line.
    systemProperty 'jmh.separateClasspathJAR', 'true'
    def results = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
    args(providers.gradleProperty('jmhArgs').getOrElse('').tokenize() + ['-rf', 'json', '-rff', results.absolutePath])
    doFirst {
        results.parentFile.mkdirs()
    }
}
