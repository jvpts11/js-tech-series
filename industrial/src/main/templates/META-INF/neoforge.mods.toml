# Mod metadata for J's Industrial.
# Values are filled in from the Gradle properties at build time.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
# The mark the mods list shows at the head of this mod's page: its own logo over the series logo.
logoFile = "${mod_id}_logo.png"
logoBlur = true

# The square icon, for mod-list screens that show one.
[modproperties.${mod_id}]
catalogueImageIcon = "${mod_id}_icon.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The series ships in lockstep: every mod requires the core at exactly its own version.
[[dependencies.${mod_id}]]
modId = "jscore"
type = "required"
versionRange = "[${mod_version}]"
ordering = "AFTER"
side = "BOTH"
