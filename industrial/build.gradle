/*
 * J's Industrial: the industrial mod of the series. It depends on the core only; with J's Computers installed beside
 * it, its integration (behind a guard) brings the Industrial Controller Computer, so it compiles against J's Computers
 * for that alone and never requires it.
 */
plugins {
    id 'net.neoforged.moddev'
}

// The data run below reaches into the core's and the computing mod's source sets, so they must be configured first.
evaluationDependsOn(':core')
evaluationDependsOn(':computers')

// checkGeneratedData: the data run's files kept up to date.
apply from: rootProject.file('gradle/generated-data.gradle')

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        data {
            data()
            gameDirectory = rootProject.file('run')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('core/src/main/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('computers/src/main/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('computers/src/generated/resources/').getAbsolutePath()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    /*
     * Which source sets belong to which mod: the data run loads this mod, the core it depends on, and J's Computers,
     * so the content that comes with it is generated too.
     */
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        jscore {
            sourceSet(rootProject.project(':core').sourceSets.main)
        }
        jsc {
            sourceSet(rootProject.project(':computers').sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':core')
    // For the integration alone, which starts only when J's Computers is installed; the data run has it at hand.
    compileOnly project(':computers')
    localRuntime project(':computers')
}

// Expands the declared properties into the mod metadata template. A missing property is an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
