# The few places J's Core reaches into the game, each with the reason no event or API could do it.
# Every line has a test that fails if the game or NeoForge moves what it reaches.

# A screen declared in a file lays its slots out where its layout puts them, worked out on the player's game from the
# file, the style and the font; a slot's place is final in the game, set once where the menu is built on both sides.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y
