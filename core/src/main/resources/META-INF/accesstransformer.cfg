# The few places J's Core reaches into the game, each with the reason no event or API could do it.
# Every line has a test that fails if the game or NeoForge moves what it reaches.

# A screen declared in a file lays its slots out where its layout puts them, worked out on the player's game from the
# file, the style and the font; a slot's place is final in the game, set once where the menu is built on both sides.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y

# The game's toasts come down the top right corner a slot at a time and say nowhere how far; the HUD elements of that
# corner start under the slots they hold, so a toast never covers a notification.
public net.minecraft.client.gui.components.toasts.ToastComponent occupiedSlots

# A cable or a space of parts holds the game's own torches, levers, buttons and pressure plates, each run by the
# game's own rules at the space's place. Where a block of them is placed, how long a button stays pressed and what it
# sounds like, and how a plate counts what stands on it, how long it stays pressed and what it sounds like, are kept
# in members the game does not open; every override of a method opened here is opened with it.
public net.minecraft.world.item.BlockItem getPlacementState(Lnet/minecraft/world/item/context/BlockPlaceContext;)Lnet/minecraft/world/level/block/state/BlockState;
public net.minecraft.world.item.StandingAndWallBlockItem getPlacementState(Lnet/minecraft/world/item/context/BlockPlaceContext;)Lnet/minecraft/world/level/block/state/BlockState;
public net.minecraft.world.item.GameMasterBlockItem getPlacementState(Lnet/minecraft/world/item/context/BlockPlaceContext;)Lnet/minecraft/world/level/block/state/BlockState;
public net.minecraft.world.level.block.ButtonBlock type
public net.minecraft.world.level.block.ButtonBlock ticksToStayPressed
public net.minecraft.world.level.block.BasePressurePlateBlock type
public net.minecraft.world.level.block.BasePressurePlateBlock getPressedTime()I
public net.minecraft.world.level.block.WeightedPressurePlateBlock getPressedTime()I
public net.minecraft.world.level.block.BasePressurePlateBlock getSignalStrength(Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;)I
public net.minecraft.world.level.block.PressurePlateBlock getSignalStrength(Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;)I
public net.minecraft.world.level.block.WeightedPressurePlateBlock getSignalStrength(Lnet/minecraft/world/level/Level;Lnet/minecraft/core/BlockPos;)I

# A resource pack written for CTM overrides the connected textures of the faces of one tint index in a block model;
# which models a block's state was baked from the game keeps only in the bakery, in a member it does not open.
public net.minecraft.client.resources.model.ModelBakery topLevelModels

# A portal with no edge draws its far side from the land the game has already built; the game keeps the sections it
# built only in its view area, in a member it does not open. Drawing the world again from a second place would unsettle
# what the game works out it can see from the player's eye.
public net.minecraft.client.renderer.LevelRenderer viewArea

# A mod's camera in the third person stands over a shoulder or round a place of its own; NeoForge asks how far back
# the camera stands just before the game brings it nearer for its walls, but where it stands is set in a member the
# game does not open.
public net.minecraft.client.Camera setPosition(Lnet/minecraft/world/phys/Vec3;)V

# A sound echoes in the place the listener stands in, and walls, the air and the medium take its high notes away;
# NeoForge hands over each playing sound's channel, but the sound card's source the effects are bound to is private.
public com.mojang.blaze3d.audio.Channel source

# A Geiger counter's clicks are named in the game's subtitles for those who don't hear them, even while their cue is
# bound to no sound; the game keeps its subtitles in its HUD, in a member it does not open.
public net.minecraft.client.gui.Gui subtitleOverlay

# A player standing on a moving deck is carried with it on the server; the server checks each step a player sends
# from the last places it took as good, which the deck carries on the same way, or the deck's motion would read as
# the player moving too fast. The game keeps those places in members it does not open.
public net.minecraft.server.network.ServerGamePacketListenerImpl firstGoodX
public net.minecraft.server.network.ServerGamePacketListenerImpl firstGoodY
public net.minecraft.server.network.ServerGamePacketListenerImpl firstGoodZ
public net.minecraft.server.network.ServerGamePacketListenerImpl lastGoodX
public net.minecraft.server.network.ServerGamePacketListenerImpl lastGoodY
public net.minecraft.server.network.ServerGamePacketListenerImpl lastGoodZ

# A block of a moving structure being broken shows its cracks where the block is in the world; the game keeps each
# block's breaking only in its level renderer, in a member it does not open, and draws it at the block's place.
public net.minecraft.client.renderer.LevelRenderer destructionProgress

# A moving structure's blocks change hands with the world's in one frame: the structure is drawn until the sections
# of the world its blocks land in are drawn with them, which the game tells only by a section of its view area, got
# by a member it does not open, and by the sections it draws this frame, kept in another.
public net.minecraft.client.renderer.ViewArea getRenderSectionAt(Lnet/minecraft/core/BlockPos;)Lnet/minecraft/client/renderer/chunk/SectionRenderDispatcher$RenderSection;
public net.minecraft.client.renderer.LevelRenderer visibleSections

# A worldgen modifier changes a density function or a structure set of the game or any mod as the server starts,
# before its worlds are made: the datapack registries are frozen by then, and NeoForge's own modifiers reach only
# biomes and structures, so the new value is put in the registry's holder, which the game opens only to itself; the
# game's one override of it is opened with it.
public net.minecraft.core.Holder$Reference bindValue(Ljava/lang/Object;)V
public net.minecraft.core.RegistrySetBuilder$LazyHolder bindValue(Ljava/lang/Object;)V
