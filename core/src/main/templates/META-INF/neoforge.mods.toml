# Mod metadata for J's Core.
# Values are filled in from the Gradle properties at build time.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
# The work of others the Core carries, shown on its page in the mods list; THIRD_PARTY_NOTICES.md has the notices.
credits = "Fixed-width fonts: Misc Fixed 6x10, 9x15 and 10x20, from Markus Kuhn's ucs-fonts as the X.Org Foundation ships them, public domain. YAML: SnakeYAML, Apache License 2.0."
# The mark the mods list shows at the head of this mod's page: its own logo over the series logo.
logoFile = "${mod_id}_logo.png"
logoBlur = true

# The square icon, for mod-list screens that show one.
[modproperties.${mod_id}]
catalogueImageIcon = "${mod_id}_icon.png"

# Mixin config: the mixins live under the dev.jstech.core.mixin package.
[[mixins]]
config = "${mod_id}.mixins.json"

# The access transformer: each line says why it is there.
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Mekanism is optional: when it is present, its chemicals move and store like fluids through the Core.
[[dependencies.${mod_id}]]
modId = "mekanism"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# KubeJS is optional: when it is present, its scripts reach what the series' mods hand them, by the names they gave,
# and the Core's events. The Core is made first, so its bindings are there when the startup scripts run.
[[dependencies.${mod_id}]]
modId = "kubejs"
type = "optional"
versionRange = "[2101.7.2,)"
ordering = "BEFORE"
side = "BOTH"

# CraftTweaker is optional: when it is present, its scripts reach the Core's recipes of processing machines, its
# progress and its events, under mods.jscore.
[[dependencies.${mod_id}]]
modId = "crafttweaker"
type = "optional"
versionRange = "[21.0.39,)"
ordering = "NONE"
side = "BOTH"

# FTB Quests is optional: when it is present, its quests have tasks of the Core's knowledge, milestones and steps.
[[dependencies.${mod_id}]]
modId = "ftbquests"
type = "optional"
versionRange = "[2101.1.36,)"
ordering = "NONE"
side = "BOTH"

# Simple Voice Chat is optional: when it is present, voices go through walls, thin air and a vacuum as sounds do.
[[dependencies.${mod_id}]]
modId = "voicechat"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
