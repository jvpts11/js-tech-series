// J's Core: the shared library of the series. No gameplay of its own; every other mod requires it.
plugins {
    id 'net.neoforged.moddev'
}

// The unit tests reach the test kit's classes, so it is configured first.
evaluationDependsOn(':testkit')

// checkGeneratedData: the data run's files kept up to date.
apply from: rootProject.file('gradle/generated-data.gradle')

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
    // A font's source is read by the data run, which writes the picture and font file the game draws from.
    exclude("**/*.bdf")
    exclude("**/font/source/*.ttf")
    exclude("**/font/source/*.otf")
}

// The Core's API photo travels in its jar, so a mod built on it checks what it uses against the very Core it has
// (the test kit's ApiUse, photoOf("core")).
tasks.named('processResources', ProcessResources).configure {
    from('src/test/resources/api') {
        include 'core.txt'
        into 'META-INF/jstech/api'
    }
}

/*
 * JourneyMap publishes its API only as snapshots, and carries the API itself inside its jar. The Core compiles against
 * that very API, taken out of the pinned JourneyMap jar, so the build never follows a snapshot.
 */
configurations {
    journeyMapJar
}
def journeyMapApi = tasks.register('journeyMapApi', Copy) {
    from({ zipTree(configurations.journeyMapJar.singleFile) }) {
        include 'META-INF/jarjar/journeymap-api-*.jar'
        rename { 'journeymap-api.jar' }
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('journeymap-api')
}

dependencies {
    /*
     * SnakeYAML, the YAML format of the settings files. NeoForge brings the TOML and JSON libraries and none for
     * YAML, so the Core carries it inside its own jar (Apache-2.0; its notice is in THIRD_PARTY_NOTICES.md). The
     * floor is the newest release: every version before 2.0 builds any class a file names (CVE-2022-1471), and
     * the settings are read with the safe constructor all the same.
     */
    jarJar(implementation("org.yaml:snakeyaml")) {
        version {
            strictly '[2.7,3.0)'
            prefer '2.7'
        }
    }
    /*
     * The TOML and JSON libraries the settings formats are written on, the vector library the models are worked out
     * with, and the serialization library a kind of Operation names to read a request written as text, come with the
     * game, and the unit tests run without it; they get the same four, at the versions the game and NeoForge bring,
     * and nothing else of the game. The model tests read model files as JSON themselves.
     */
    testRuntimeOnly 'com.electronwill.night-config:toml:3.8.3'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'org.joml:joml:1.10.5'
    testImplementation 'com.mojang:datafixerupper:8.0.16'
    /*
     * The test kit's checks that read sources, the test of the API's surface among them, run in the Core's unit
     * tests as they run in any mod's: the kit's own classes only, none of the game it is built against.
     */
    testImplementation files(project(':testkit').sourceSets.main.output)

    // Mekanism API: the chemical bridge compiles against it, but no Mekanism class is loaded unless Mekanism is
    // present (soft dependency, guarded at runtime).
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    /*
     * The Core's soft integrations: each compiles against its mod and is reached only behind a check that the mod
     * is loaded, or through the mod's own discovery of its plugins, so none of them is ever required.
     */
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    // The claim mods the Core's protection asks: only their own classes, so their libraries never meet the Core's.
    compileOnly("dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}") { transitive = false }
    compileOnly("maven.modrinth:open-parties-and-claims:${opac_version}") { transitive = false }
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}") { transitive = false }
    compileOnly "me.shedaniel.cloth:basic-math:${basic_math_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    // Only its own classes: what Accessories brings with it is nothing the Core's adapter names.
    compileOnly("io.wispforest:accessories-neoforge:${accessories_version}") { transitive = false }
    compileOnly "maven.modrinth:jade:${jade_version}"
    // The map mods the markers are shown in: Xaero's Minimap's own classes (its World Map shows the minimap's
    // waypoints), and JourneyMap's API, which it carries inside its jar (see journeyMapApi below).
    compileOnly("maven.modrinth:xaeros-minimap:${xaero_minimap_version}") { transitive = false }
    journeyMapJar("maven.modrinth:journeymap:${journeymap_version}") { transitive = false }
    compileOnly files(layout.buildDirectory.file('journeymap-api/journeymap-api.jar')).builtBy(journeyMapApi)
    // KubeJS finds the Core's plugin through its plugin file; Rhino is its script engine, a mod of its own.
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    // CraftTweaker finds the Core's plugin by its annotation, and FTB Quests is handed the Core's kinds of task;
    // only their own classes.
    compileOnly("com.blamejared.crafttweaker:CraftTweaker-neoforge-${minecraft_version}:${crafttweaker_version}") {
        transitive = false
    }
    compileOnly("dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}") { transitive = false }
    // Simple Voice Chat finds the Core's plugin by its annotation; its API is all the plugin names.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    // The moving structures' layer beside Create's contraptions and Sable's sub-levels: Create's own classes, and
    // Sable's companion library, which Sable carries inside its jar.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:"
            + "${sable_companion_version}") { transitive = false }
}

// The notices of the third-party work this mod carries, beside its own licence, and the licences they come under.
tasks.named('jar', Jar).configure {
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
    }
    from(rootProject.file('licenses/Apache-2.0.txt')) {
        into 'META-INF/licenses'
    }
}

/*
 * A library carried inside the Core's jar has to be really there, and has to have its notice: the check opens the
 * built jar, finds each jar nested in it, and fails when one is missing or has no section in the notices.
 */
def checkCarriedLibraries = tasks.register('checkCarriedLibraries') {
    group = 'verification'
    description = 'Checks that the libraries the Core carries are in its jar and in THIRD_PARTY_NOTICES.md.'
    def built = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def notices = rootProject.file('THIRD_PARTY_NOTICES.md')
    inputs.file(built)
    inputs.file(notices)
    doLast {
        // Each library: the name of its section in the notices, and the licence text it needs shipped beside it.
        def carried = [snakeyaml: [name: 'SnakeYAML', licence: 'Apache-2.0.txt']]
        def nested = []
        def entries = [] as Set
        new java.util.zip.ZipFile(built.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                entries << entry.name
                if (entry.name.startsWith('META-INF/jarjar/') && entry.name.endsWith('.jar')) {
                    nested << entry.name.substring('META-INF/jarjar/'.length())
                }
            }
        }
        def text = notices.getText('UTF-8')
        carried.each { artifact, about ->
            if (!nested.any { it.startsWith(artifact + '-') }) {
                throw new GradleException("The Core's jar does not carry ${artifact}; it has ${nested}")
            }
            if (!text.contains("## ${about.name}")) {
                throw new GradleException(
                        "THIRD_PARTY_NOTICES.md has no section for ${about.name}, which the Core carries")
            }
            if (!entries.contains("META-INF/licenses/${about.licence}".toString())) {
                throw new GradleException("The Core's jar carries ${about.name} without its licence, ${about.licence}")
            }
        }
        def unknown = nested.findAll { jar -> !carried.keySet().any { jar.startsWith(it + '-') } }
        if (!unknown.isEmpty()) {
            throw new GradleException("The Core's jar carries ${unknown}, which this check does not know of")
        }
    }
}
tasks.named('check').configure { dependsOn checkCarriedLibraries }

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        data {
            data()
            gameDirectory = rootProject.file('run')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands the declared properties into the mod metadata template. A missing property is an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version.toString(),
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
